name: CI

# Server-side enforcement of the same gates as the local pre-commit hook
# (which is bypassable with --no-verify). Runs on every PR + push to master.
# This does NOT deploy — deploy stays manual via deploy/build_push.sh. See
# deploy/SECURITY_REVIEW.md §12 TODO-8/14 for the immutable-tag/promote plan.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run all pre-commit hooks (parity with local gate)
        run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Pytest
        env:
          DEPLOY_MODE: local
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret
        run: python -m pytest -p no:warnings -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install + build
        run: |
          npm ci
          npm run build

  image-scan:
    runs-on: ubuntu-latest
    needs: [gates, backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t life-planning:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: life-planning:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
